<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        label { display: block; margin-top: 10px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { margin-top: 15px; padding: 8px 16px; }
        .error-global { color: red; margin-top: 10px; }
    </style>
</head>
<body>
<h1>로그인</h1>

<div th:if="${errorMessage}" class="error-global" th:text="${errorMessage}"></div>

<form th:action="@{/member/login}" method="post">
    <label>아이디</label>
    <input type="text" name="username" required>

    <label>비밀번호</label>
    <input type="password" name="password" required>

    <button type="submit" class="btn">로그인</button>
    <a href="/member/signup" class="btn">회원가입</a>
</form>

</body>
</html>
